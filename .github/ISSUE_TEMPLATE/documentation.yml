name: 📚 Documentation
description: Something in the docs is wrong, unclear, or missing.
title: "docs: "
labels: ["type: docs", "status: needs-triage"]

body:
  - type: markdown
    attributes:
      value: |
        Documentation issues are genuinely valuable. If something confused you, it
        will confuse the next person too.

  - type: dropdown
    id: doc-set
    attributes:
      label: Which documentation set?
      options:
        - Technical docs (`docs/`)
        - Client-facing materials (`client-deliverables/`)
        - Repository governance (README, CONTRIBUTING, SECURITY, etc.)
        - Code comments / inline documentation
    validations:
      required: true

  - type: input
    id: file
    attributes:
      label: Which file?
      placeholder: docs/08-agent-modes-and-tool-system.md
    validations:
      required: false

  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem is it?
      options:
        - Factually incorrect — the docs describe behavior that does not match the code
        - Unclear or confusing
        - Missing — something is not documented at all
        - Outdated — was correct once, no longer is
        - Broken link or formatting
        - Typo or grammar
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What is wrong?
      description: Quote the passage if you can, and explain what is off about it.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: What should it say instead?
      description: A concrete suggestion is far more useful than pointing at a problem.
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request fixing this.
          required: false
