name: Security

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 8 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Block a PR that introduces a dependency with a known vulnerability or an
  # incompatible license, before it merges rather than after.
  # ---------------------------------------------------------------------------
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # NightCode is proprietary (see LICENSE). A copyleft dependency would
          # create obligations incompatible with that, so those are denied here
          # rather than discovered during a later legal review.
          deny-licenses: AGPL-3.0, GPL-2.0, GPL-3.0, LGPL-2.1, LGPL-3.0, SSPL-1.0

  # ---------------------------------------------------------------------------
  # A committed credential is the single highest-severity mistake possible in
  # this repository — the server holds the pooled inference key, the identity
  # provider secret, and the billing token.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Audit the dependency tree against known advisories.
  # ---------------------------------------------------------------------------
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"

      - run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit --audit-level=high
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # OpenSSF Scorecard: an objective, published measure of this repository's
  # supply chain posture. Results appear in the Security tab.
  #
  # This is gated to a push on the DEFAULT branch, which for this GitFlow
  # repository is `develop`, not `main`. The action refuses to run anywhere
  # else — it exits with "validating options: only default branch is
  # supported". Gating it on `main` therefore produced a job that could only
  # ever fail.
  # ---------------------------------------------------------------------------
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results to Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
