name: Release

"on":
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  BUN_VERSION: "1.2.23"

jobs:
  # ---------------------------------------------------------------------------
  # Never publish a release from a commit that does not pass the same gates a
  # pull request has to pass.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Test
        run: bun test

      - name: Build
        run: bun run build:cli

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")

          echo "Tag version:          $TAG"
          echo "package.json version: $PKG"

          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG."
            echo "::error::Bump the version in package.json before tagging. See CONTRIBUTING.md#release-process."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Confirm the build succeeds on every platform a user might run it on. This
  # job produces no release asset — see `package` below for why.
  # ---------------------------------------------------------------------------
  build-matrix:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: verify
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Build CLI
        run: bun run build:cli

  # ---------------------------------------------------------------------------
  # Produce exactly one release archive.
  #
  # `bun build --target bun` emits a platform-independent JavaScript bundle,
  # not a native executable. Building it on three runners yields three
  # byte-identical outputs — publishing them as `nightcode-linux-x64`,
  # `nightcode-darwin-arm64`, and `nightcode-windows-x64` would tell users
  # they are choosing between builds when they are not.
  #
  # Shipping genuine per-platform executables requires `bun build --compile
  # --target=bun-<platform>`, which is tracked as follow-up work. Until then,
  # one honest artifact.
  # ---------------------------------------------------------------------------
  package:
    name: Package release archive
    runs-on: ubuntu-latest
    needs: [verify, build-matrix]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Build CLI
        run: bun run build:cli

      - name: Create archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar -czf "nightcode-${VERSION}.tar.gz" -C packages/cli/dist .
          ls -l "nightcode-${VERSION}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-archive
          path: nightcode-*.tar.gz
          retention-days: 30
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [verify, package]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Flatten the artifact directory and publish a checksum file alongside
      # the archive, so a download can be verified.
      - name: Collect archive and generate checksums
        run: |
          mkdir -p release-assets
          find artifacts -name '*.tar.gz' -exec mv {} release-assets/ \;

          cd release-assets
          sha256sum ./*.tar.gz > SHA256SUMS.txt

          echo "--- release assets ---"
          ls -l
          echo "--- checksums ---"
          cat SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # Pull the section between this version's heading and whatever ends
          # it: the next release heading, or the link-definition block at the
          # bottom of the file.
          #
          # `index($0, ...) == 1` is used rather than a regex. Building a
          # dynamic regex here means writing "\\[" inside a single-quoted awk
          # program, which awk collapses to a bare "[" and then interprets as
          # the start of a character class — the pattern silently never matches
          # and the release ships with empty notes.
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found && index($0, "<!-- Release comparison links -->") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::warning::No CHANGELOG.md section found for version $VERSION. Falling back to auto-generated notes."
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
            echo "--- Extracted release notes ---"
            cat release-notes.md
          fi

      - name: Determine if prerelease
        id: prerelease
        run: |
          if [[ "$GITHUB_REF_NAME" =~ -(alpha|beta|rc) ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.has_notes == 'true' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.has_notes != 'true' }}
          prerelease: ${{ steps.prerelease.outputs.value }}
          draft: false
          files: |
            release-assets/*.tar.gz
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------------------
  # After a release lands on main, merge it back into develop so the version
  # bump and any release fixes flow forward. Skipping this is the single most
  # common way GitFlow repositories drift.
  # ---------------------------------------------------------------------------
  back-merge:
    name: Back-merge main into develop
    runs-on: ubuntu-latest
    needs: github-release
    timeout-minutes: 10
    if: "!contains(github.ref_name, '-')"
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Open back-merge pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh pr list --base develop --head main --state open --json number --jq 'length' | grep -qv '^0$'; then
            echo "A back-merge pull request from main into develop is already open."
            exit 0
          fi

          gh pr create \
            --base develop \
            --head main \
            --title "chore(release): back-merge ${GITHUB_REF_NAME} into develop" \
            --body "Automated back-merge after releasing \`${GITHUB_REF_NAME}\`.

          This carries the version bump and any release-time fixes from \`main\`
          back into \`develop\` so the branches do not drift.

          See CONTRIBUTING.md#release-process." \
            || echo "Nothing to back-merge, or the PR already exists."
