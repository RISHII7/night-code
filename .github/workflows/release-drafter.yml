name: PR Autolabeler

"on":
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  autolabel:
    name: Autolabel from commit type
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      # This action is used ONLY to label pull requests from their Conventional
      # Commit title (`feat:` -> `type: feature`, and so on). Its
      # release-drafting half is switched off.
      #
      # CHANGELOG.md is this project's single source of truth for release
      # notes, and `release.yml` extracts a tag's notes directly from it. While
      # the drafter was also allowed to manage releases it created a draft for
      # the upcoming tag on every pull request. Publishing the tag then landed
      # on that existing draft, and the drafter's auto-generated body replaced
      # the curated one — which is exactly what happened to v0.1.0. It also
      # listed one pull request under two headings whenever it carried two
      # matching labels.
      #
      # Two systems cannot own the release body. The changelog wins.
      - uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          disable-releaser: true
          disable-autolabeler: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
