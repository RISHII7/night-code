name: PR Validation

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # PRs are squash-merged into `develop`, so the PR title becomes the commit
  # message on the trunk. It must be a valid Conventional Commit.
  # ---------------------------------------------------------------------------
  pr-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      statuses: write
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            cli
            server
            database
            shared
            docs
            ci
            deps
            release
            repo
          requireScope: false
          subjectPattern: ^(?![A-Z]).+[^.]$
          subjectPatternError: |
            The subject "{subject}" is invalid for the PR title "{title}".

            The subject must start with a lowercase letter and must not end with
            a period. See CONTRIBUTING.md.
          wip: true

  # ---------------------------------------------------------------------------
  # Every commit on the branch must also be a valid Conventional Commit, so the
  # history stays legible even when a PR is merged with a merge commit
  # (release/* and hotfix/* branches into main).
  # ---------------------------------------------------------------------------
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Lint commit messages in this PR
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.js
          failOnWarnings: true
          helpURL: https://github.com/RISHII7/night-code/blob/main/CONTRIBUTING.md#commit-convention

  # ---------------------------------------------------------------------------
  # Enforce the branching model: nothing lands on `main` except a release or a
  # hotfix. Everything else targets `develop`.
  # ---------------------------------------------------------------------------
  branch-target:
    name: Branch target policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify base branch is correct for this head branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          echo "Head: $HEAD_REF -> Base: $BASE_REF"

          if [ "$BASE_REF" = "main" ]; then
            case "$HEAD_REF" in
              release/*|hotfix/*|develop)
                echo "OK: '$HEAD_REF' is permitted to target main."
                ;;
              *)
                echo "::error::Only 'release/*', 'hotfix/*', or 'develop' may target 'main'."
                echo "::error::Branch '$HEAD_REF' should target 'develop' instead."
                echo "::error::See the branching model in CONTRIBUTING.md."
                exit 1
                ;;
            esac
          fi

          if [ "$BASE_REF" = "develop" ]; then
            case "$HEAD_REF" in
              feat/*|fix/*|docs/*|refactor/*|perf/*|test/*|chore/*|ci/*|build/*|style/*|revert/*|main)
                echo "OK: '$HEAD_REF' is permitted to target develop."
                ;;
              *)
                echo "::error::Branch '$HEAD_REF' does not use a recognized prefix."
                echo "::error::Use one of: feat/ fix/ docs/ refactor/ perf/ test/ chore/ ci/ build/ style/ revert/"
                echo "::error::See the branching model in CONTRIBUTING.md."
                exit 1
                ;;
            esac
          fi

  # ---------------------------------------------------------------------------
  # A user-facing change without a changelog entry is a change nobody will ever
  # find out about. Bypass with the `skip-changelog` label when genuinely
  # internal.
  # ---------------------------------------------------------------------------
  changelog:
    name: Changelog entry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: "!contains(github.event.pull_request.labels.*.name, 'skip-changelog') && !contains(github.event.pull_request.labels.*.name, 'type: dependencies')"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify CHANGELOG.md was modified
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1 || true

          if git diff --name-only "origin/${{ github.event.pull_request.base.ref }}...HEAD" | grep -q '^CHANGELOG.md$'; then
            echo "CHANGELOG.md was updated."
          else
            echo "::error::This pull request does not update CHANGELOG.md."
            echo "::error::Add an entry under '## [Unreleased]', or apply the 'skip-changelog' label if this change is purely internal."
            echo "::error::See CONTRIBUTING.md#changelog-discipline."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Large PRs get reviewed worse. Label them so that is visible up front.
  # ---------------------------------------------------------------------------
  pr-size:
    name: Size label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Apply size label
        uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: "size: xs"
          xs_max_size: "10"
          s_label: "size: s"
          s_max_size: "100"
          m_label: "size: m"
          m_max_size: "500"
          l_label: "size: l"
          l_max_size: "1000"
          xl_label: "size: xl"
          fail_if_xl: "false"
          message_if_xl: |
            This pull request exceeds 1000 changed lines.

            Large pull requests receive worse review than small ones — reviewers
            skim, and defects slip through. Consider splitting this into a stack
            of focused, independently reviewable changes.

            If the size is unavoidable (a generated file, a large doc set, a
            mechanical rename), say so in the description so the reviewer knows
            what to skim and what to read closely.
          files_to_ignore: "bun.lock package-lock.json"
