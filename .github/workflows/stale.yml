name: Stale

"on":
  schedule:
    # Daily at 05:00 UTC.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    name: Mark and close stale issues and PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 14

          stale-issue-label: "status: stale"
          stale-pr-label: "status: stale"

          stale-issue-message: |
            This issue has been automatically marked as stale because it has not
            had activity in 60 days.

            If it is still relevant, leave a comment and it will stay open. If no
            one responds within 14 days, it will be closed — not because it was
            invalid, but because an unbounded backlog helps nobody. A closed
            issue can always be reopened.

          stale-pr-message: |
            This pull request has been automatically marked as stale because it
            has not had activity in 30 days.

            If you are still working on it, leave a comment or push a commit. If
            you have run out of time for it, that is completely fine — say so and
            someone else may pick it up.

          close-issue-message: |
            Closing this as stale. If this is still an issue, please reopen it or
            file a new one referencing this — we would rather hear about it twice
            than lose it.

          close-pr-message: |
            Closing this pull request as stale. Thank you for the contribution
            attempt — reopen it any time you are able to pick it back up.

          # Never auto-close these. A confirmed security issue or a bug someone
          # has already triaged should not disappear because nobody commented.
          exempt-issue-labels: >-
            status: pinned,
            status: in-progress,
            type: security,
            security: needs-review,
            priority: critical,
            priority: high,
            good first issue,
            help wanted
          exempt-pr-labels: >-
            status: pinned,
            status: in-progress,
            type: security,
            security: needs-review,
            priority: critical

          exempt-all-milestones: true
          ascending: true
          operations-per-run: 100
